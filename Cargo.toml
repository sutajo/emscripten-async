[package]
name = "emscripten-futures"
authors = ["Tamás Suhajda"]
version = "0.1.0"
edition = "2024"
description = "A local async executor and awaitable Emscripten operations for Rust WebAssembly applications"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["emscripten", "wasm", "async", "executor", "jspi"]
categories = ["asynchronous", "wasm"]
include = ["src/**", "build.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
default-target = "wasm32-unknown-emscripten"
targets = ["wasm32-unknown-emscripten"]

[target.'cfg(target_os = "emscripten")'.dependencies]
emscripten-functions-sys = "5.0.401"
futures = "0.3.34"

[target.'cfg(not(target_os = "emscripten"))'.dev-dependencies]
browser-test-bin = { path = "tests/browser-bin", artifact = "bin", target = "wasm32-unknown-emscripten" }
serde_json = "1.0"
tempfile = "3"
tiny_http = "0.12"
